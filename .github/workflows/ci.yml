name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      # Universal (arm64 + x86_64) Clicky.app; CI has no signing identity, so ad-hoc.
      - run: cargo xtask bundle --adhoc
      - name: Universal binary has both slices
        run: |
          archs="$(lipo -archs target/bundle/Clicky.app/Contents/MacOS/Clicky)"
          echo "archs: $archs"
          echo "$archs" | grep -qw x86_64
          echo "$archs" | grep -qw arm64
