    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A7CF0"/>
      <stop offset="1" stop-color="#1F3FA6"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="232" y="254" width="560" height="560" rx="128" fill="#0D1E57" opacity="0.22"/>
  <rect x="232" y="232" width="560" height="560" rx="128" fill="#E9E0CF"/>
  <rect x="290" y="262" width="444" height="420" rx="88" fill="#FFFDF8"/>
  <rect x="424" y="574" width="176" height="44" rx="22" fill="#2F5BD3"/>
</svg>
