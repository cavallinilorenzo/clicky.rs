[workspace]
resolver = "3"
members = ["crates/clicky", "crates/clicky-pack", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/cavallinilorenzo/clicky.rs"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Decoding the source audio is slow without optimisation; this keeps
# `cargo test` and `cargo xtask packs` quick in the dev profile.
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
